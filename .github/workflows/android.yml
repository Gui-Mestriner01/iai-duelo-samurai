name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testes de unidade
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar o APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: IAI-Duelo-Samurai-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Guardar o relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: app/build/reports/tests/

      - name: Publicar o APK na página de versões
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "IAI-Duelo-Samurai-v$VERSION.apk"
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --target "$GITHUB_SHA" --title "IAI v$VERSION" --notes "APK gerado automaticamente pelo GitHub Actions. Baixe o arquivo .apk abaixo e instale no celular."
          gh release upload "v$VERSION" "IAI-Duelo-Samurai-v$VERSION.apk" --clobber
